[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlrsearch"
version = "0.1.0"
description = "Fast offline photo search with semantic embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mkimura"}
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",  # Required for SigLIP tokenizer

    # Vector DB
    "qdrant-client>=1.7.0",

    # Image processing
    "Pillow>=10.0.0",
    "rawpy>=0.19.0",
    "numpy>=1.24.0,<2.0.0 ; sys_platform == 'linux'",
    "numpy>=1.24.0 ; sys_platform != 'linux'",

    # Hashing & dedup
    "imagehash>=4.3.0",
    "xxhash>=3.4.0",

    # EXIF
    "exifread>=3.0.0",

    # UI - pinned to 6.4.x on Linux for Fcitx/IME compatibility with system Qt
    "PySide6>=6.4.0,<6.5.0 ; sys_platform == 'linux'",
    "PySide6>=6.7.0 ; sys_platform != 'linux'",

    # API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",  # Required for file uploads

    # Utilities
    "tqdm>=4.66.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
fastlrsearch = "fastlrsearch.main:main"
fastlrsearch-ingest = "fastlrsearch.cli.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
